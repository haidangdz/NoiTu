<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nối từ — Companion</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #10131c; color: #f8fafc; }
    main { width: min(100%, 390px); min-height: 100vh; padding: 16px; margin: auto; background: #171b27; }
    h1 { font-size: 19px; margin: 0 0 5px; }
    .hint { color: #aab4c8; font-size: 13px; margin: 0 0 14px; line-height: 1.4; }
    .search { display: flex; gap: 8px; }
    input, select, button { font: inherit; border-radius: 9px; }
    input, select { border: 1px solid #3b455c; background: #0e1119; color: inherit; padding: 11px 12px; }
    #query { min-width: 0; flex: 1; font-size: 20px; text-transform: lowercase; }
    button { border: 0; color: #07111f; background: #76a9fa; font-weight: 800; cursor: pointer; padding: 0 14px; }
    button:hover { background: #9bc1ff; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #facc15; outline-offset: 2px; }
    details { margin: 12px 0; border: 1px solid #30394d; border-radius: 9px; padding: 8px 10px; color: #d2d9e6; }
    summary { cursor: pointer; font-size: 13px; }
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-top: 10px; }
    .filters label { color: #aab4c8; font-size: 12px; }
    .filters input, .filters select { width: 100%; margin-top: 4px; padding: 8px; }
    #status { min-height: 20px; color: #aab4c8; font-size: 13px; margin: 12px 1px 8px; }
    #results { display: grid; gap: 8px; }
    .word { display: flex; align-items: center; width: 100%; min-height: 48px; padding: 10px 12px; text-align: left; color: #f8fafc; background: #222a3b; border: 1px solid #39455e; }
    .word:hover { background: #2c3850; }
    .key { display: grid; place-items: center; width: 24px; height: 24px; margin-right: 10px; border-radius: 5px; background: #0e1119; color: #facc15; font-size: 12px; }
    .word-text { font-size: 19px; letter-spacing: .2px; }
    .copied { color: #86efac !important; }
    .footer { margin: 13px 1px 0; color: #8995aa; font-size: 12px; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <h1>Nối từ</h1>
    <p class="hint">Nhìn ảnh trong Roblox → gõ chữ cái/cụm chữ vào đây → <b>Enter</b>. Nhấn <b>1–5</b> để copy nhanh một đáp án.</p>
    <form id="searchForm" class="search">
      <input id="query" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Ví dụ: ap" aria-label="Chữ cái cần tìm">
      <button type="submit">Tìm</button>
    </form>
    <details>
      <summary>Bộ lọc (chỉ mở khi cần)</summary>
      <div class="filters">
        <label>Chế độ
          <select id="mode"><option value="start">Bắt đầu bằng</option><option value="end">Kết thúc bằng</option></select>
        </label>
        <label>Kết thúc bằng (tuỳ chọn)
          <input id="endWith" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="vd: x">
        </label>
        <label>Dài hơn
          <input id="minLen" type="number" value="2" min="0">
        </label>
        <label>Ngắn hơn
          <input id="maxLen" type="number" min="1" placeholder="∞">
        </label>
      </div>
    </details>
    <div id="status" role="status">Đang nạp danh sách từ…</div>
    <section id="results" aria-label="Kết quả"></section>
    <p class="footer">Enter: tìm bộ mới · 1–5: copy đáp án · Esc: xoá để nhập từ khác</p>
  </main>
  <script>
    let words = [], loaded = false, lastMatches = [], shown = [];
    const $ = id => document.getElementById(id);
    const query = $('query'), results = $('results'), status = $('status');

    fetch('W.txt').then(r => {
      if (!r.ok) throw new Error('Không đọc được W.txt');
      return r.text();
    }).then(text => {
      words = text.split(/\r?\n/).map(w => w.trim().toLowerCase()).filter(w => /^[a-z]+$/.test(w));
      loaded = true;
      status.textContent = `Sẵn sàng — ${words.length.toLocaleString('vi-VN')} từ.`;
      query.focus();
    }).catch(() => status.textContent = 'Không nạp được danh sách từ. Hãy mở web qua máy chủ, không mở file trực tiếp.');

    const shuffledFive = matches => {
      const pool = matches.slice();
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool.slice(0, 5);
    };
    function render() {
      results.replaceChildren();
      shown.forEach((word, index) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'word'; b.dataset.index = index;
        b.innerHTML = `<span class="key">${index + 1}</span><span class="word-text">${word}</span>`;
        b.addEventListener('click', () => copyWord(index));
        results.append(b);
      });
    }
    async function copyWord(index) {
      const word = shown[index]; if (!word) return;
      try { await navigator.clipboard.writeText(word); }
      catch { return; }
      const b = results.querySelector(`[data-index="${index}"]`);
      b.classList.add('copied'); b.querySelector('.key').textContent = '✓';
      status.textContent = `Đã copy “${word}”.`;
      setTimeout(() => { if (b.isConnected) { b.classList.remove('copied'); b.querySelector('.key').textContent = index + 1; } }, 900);
    }
    function findWords(reuseMatches = false) {
      if (!loaded) return;
      if (!reuseMatches) {
        const q = query.value.trim().toLowerCase();
        const end = $('endWith').value.trim().toLowerCase();
        const min = Number($('minLen').value || 0), maxValue = $('maxLen').value, max = maxValue ? Number(maxValue) : Infinity;
        if (!q && !end) { status.textContent = 'Gõ ít nhất một chữ cái trước.'; results.replaceChildren(); return; }
        if (maxValue && min >= max) { status.textContent = '“Dài hơn” phải nhỏ hơn “Ngắn hơn”.'; return; }
        lastMatches = words.filter(w => {
          const mainOk = q ? ($('mode').value === 'start' ? w.startsWith(q) : w.endsWith(q)) : true;
          return mainOk && (!end || w.endsWith(end)) && w.length > min && w.length < max;
        });
      }
      shown = shuffledFive(lastMatches); render();
      status.textContent = shown.length ? `${lastMatches.length.toLocaleString('vi-VN')} từ phù hợp — Enter để đổi bộ khác.` : 'Không tìm thấy từ phù hợp.';
      query.focus(); query.select();
    }
    $('searchForm').addEventListener('submit', e => { e.preventDefault(); findWords(lastMatches.length > 0 && query.value.trim() === query.dataset.lastQuery); query.dataset.lastQuery = query.value.trim(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { query.value = ''; query.focus(); results.replaceChildren(); status.textContent = 'Sẵn sàng nhập từ mới.'; return; }
      if (/^[1-5]$/.test(e.key) && !e.ctrlKey && !e.altKey && !e.metaKey) { e.preventDefault(); copyWord(Number(e.key) - 1); }
    });
  </script>
</body>
</html>
